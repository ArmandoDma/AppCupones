<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador Próximamente</title>

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/buscar.css" />

</head>

<body>
    <div class="card">

        <div class="icon">
            <i class='bx bx-search-alt'></i>
        </div>

        <h1>Buscador y filtros</h1>

        <p>
            Esta función aún no está disponible.<br>
            Muy pronto podrás encontrar y filtrar cupones fácilmente.
        </p>

        <div class="features">
            <div class="feature">
                <i class='bx bx-search'></i>
                <span>Búsqueda</span>
            </div>

            <div class="feature">
                <i class='bx bx-filter-alt'></i>
                <span>Filtros</span>
            </div>

            <div class="feature">
                <i class='bx bx-time-five'></i>
                <span>Rápido</span>
            </div>
        </div>

        <div class="badge">
            <i class='bx bx-wrench'></i>
            En desarrollo
        </div>

    </div>
</body>

</html>
